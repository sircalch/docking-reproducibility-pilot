name: Evidence check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reproduce-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Regenerate evidence figures in a temporary location
        run: Rscript reports/render_figures.R "$RUNNER_TEMP/evidence-figures"
      - name: Verify evidence references
        run: |
          Rscript scripts/validate_tier1_inputs.R --help
          test -f reports/EVIDENCE-STATUS.md
          test -f manuscript/SUPPLEMENTARY-EVIDENCE-NOTE.md
          test -f protocol/TIER1-INPUT-CONTRACT.md
          test -f reports/figures/figure-1-evidence-pathway.svg
          test -f reports/figures/figure-2-retrospective-metrics.svg
          test -f reports/figures/figure-3-top5-enrichment.svg
          test -s "$RUNNER_TEMP/evidence-figures/figure-1-evidence-pathway.svg"
          test -s "$RUNNER_TEMP/evidence-figures/figure-2-retrospective-metrics.svg"
          test -s "$RUNNER_TEMP/evidence-figures/figure-3-top5-enrichment.svg"
      - name: Test the Tier 1 input preflight contract
        run: Rscript tests/test_tier1_preflight.R

  validate-method-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile methodological scripts without executing data processing
        run: python -m py_compile scripts/extract_rcsb_1l2s_chain_a.py scripts/repair_missing_heavy_atoms.py
